# 個人行事曆 LINE 提醒：每天台灣時間早上 8 點執行一次 line_remind.py
# 需要先在 GitHub 倉庫 → Settings → Secrets and variables → Actions 新增兩個 Secret：
#   LINE_CHANNEL_ACCESS_TOKEN     LINE 的 Channel access token (long-lived)
#   GOOGLE_SERVICE_ACCOUNT_JSON   Google 服務帳號 JSON 檔的完整內容（與 Render 用的同一個檔案）
# 手動測試：GitHub → Actions → 「LINE 行事曆提醒」→ Run workflow（預設只預覽、不發送）
name: LINE 行事曆提醒

on:
  schedule:
    - cron: "0 0 * * *"          # UTC 00:00 ＝ 台灣時間 08:00（GitHub 排程尖峰時段可能延遲數分鐘到數十分鐘）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只預覽不發送（true＝預覽；false＝真的發送）"
        type: choice
        options: ["true", "false"]
        default: "true"

concurrency:
  group: line-remind
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            modules
            line_remind.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安裝套件
        run: pip install gspread google-auth requests

      - name: 寫入 Google 服務帳號金鑰（只存在這次執行的暫存區）
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then echo "::error::尚未設定 Secret：GOOGLE_SERVICE_ACCOUNT_JSON"; exit 1; fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"

      - name: 檢查並發送提醒
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/sa.json
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python line_remind.py
