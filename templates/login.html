<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統登入</title>
    <!-- 使用 Bootstrap 5 快速佈局 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background: #ffffff;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-4">系統登入</h3>

    <!-- 顯示錯誤/提示訊息 -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('billing.login', next=request.args.get('next', '')) }}" method="POST">
        <!-- 🆕 隱藏欄位：用來存放前端自動抓到的內網 IP -->
        <input type="hidden" id="local_ip" name="local_ip" value="">

        <div class="mb-3">
            <label for="username" class="form-label">帳號</label>
            <input type="text" class="form-length form-control" id="username" name="username" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">密碼</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">登入</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- 🆕 自動偵測內網 IP 的腳本 -->
<script>
function getLocalIP() {
    return new Promise((resolve) => {
        const pc = new RTCPeerConnection({ iceServers: [] });
        pc.createDataChannel('');
        pc.createOffer().then(offer => pc.setLocalDescription(offer));
        pc.onicecandidate = candidate => {
            if (!candidate || !candidate.candidate) return;
            const ipMatch = candidate.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
            if (ipMatch) {
                resolve(ipMatch[1]);
                pc.onicecandidate = () => {};
            }
        };
        setTimeout(() => resolve('無法取得內網IP'), 1000);
    });
}

document.addEventListener("DOMContentLoaded", async () => {
    const ipInput = document.getElementById("local_ip");
    if (ipInput) {
        ipInput.value = await getLocalIP();
    }
});
</script>

</body>
</html>
