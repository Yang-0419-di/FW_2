<!-- === 個人行事曆（由 personal.html 引入）===
     資料存在 Google Sheet「個人行事曆」分頁；新增、編輯、刪除即時寫入，不需經過 PM 工具與 Git 發佈。 -->
<h2 id="pc-title">
  <button type="button" id="pcToggle" aria-expanded="true" aria-controls="pcBody" style="margin-right: 8px;" title="顯示／隱藏個人行事曆">▼</button>
  <span class="pc-title-text" id="pcTitleText">{{ personal_page }} - 個人行事曆</span>
</h2>

<div id="pcBody">
<!-- LINE 通知綁定狀態 -->
<div class="pc-line" id="pcLine">
  <span id="pcLineText">LINE 通知：讀取中…</span>
  <button type="button" class="pc-btn" id="pcLineCode" style="display:none;">取得綁定碼</button>
  <button type="button" class="pc-btn pc-link" id="pcLineUnbind" style="display:none;">解除綁定</button>
  <div id="pcLineCodeBox" class="pc-line-code" style="display:none;"></div>
</div>
<div class="pc-card">
  <div class="pc-card-title">新增事件</div>
  <form id="pcAddForm" class="pc-form" autocomplete="off">
    <label>日期<input type="date" name="date" required></label>
    <label>工程師
      <select name="person">
        {% for s in STAFF %}<option value="{{ s.name }}" {% if s.name == personal_page %}selected{% endif %}>{{ s.name }}</option>{% endfor %}
      </select>
    </label>
    <label>店編（或 休／MFP 等）<input name="store" list="pcStoreList" maxlength="20"></label>
    <label>店名（有店編會自動帶入）<input name="name" maxlength="40"></label>
    <label>內容<input name="content" list="pcContentList" maxlength="60"></label>
    <label>時間<input name="time" placeholder="10:00" maxlength="20"></label>
    <label>特殊（Y）<input name="special" maxlength="1" placeholder="Y"></label>
    <label>LINE 提前通知
      <span class="pc-notify">
        <select name="notify_mode">
          <option value="">不通知</option>
          <option value="0">當日</option>
          <option value="custom">提前天數</option>
        </select>
        <input type="number" name="notify_days" min="1" max="60" placeholder="天" style="display:none;">
      </span>
    </label>
  </form>
  <div class="pc-actions">
    <button type="button" class="pc-btn pc-primary" id="pcAddBtn">新增</button>
    <span class="pc-hint" id="pcAddMsg">新增後會立即顯示在下方行事曆；點行事曆上的事件可以編輯或刪除。</span>
  </div>
</div>

<datalist id="pcStoreList"></datalist>
<datalist id="pcContentList">
  <option value="回裝"><option value="閉店"><option value="新開"><option value="裝潢撤機"><option value="裝潢撤店"><option value="休假"><option value="特休"><option value="保養">
</datalist>

<div id="pcMsg" class="pc-msg" style="display:none;"><span id="pcMsgText"></span><button type="button" id="pcRetry" class="pc-btn" style="display:none;">重新載入</button></div>

<div class="pc-tools">
  <button type="button" class="pc-btn" id="pcWeekendBtn">顯示週六日</button>
  <button type="button" class="pc-btn pc-link" id="pcWeekendAuto" style="display:none;">恢復自動</button>
</div>
<div id="pcCalendar"></div>
</div><!-- /#pcBody -->

<script>
  // 依記憶的狀態先套用收合（在畫面顯示前執行，避免先展開再收起的閃動）；每位人員的頁面各自記憶
  (function () {
    var collapsed = false;
    try { collapsed = localStorage.getItem('pmq3.personalCalendar.collapsed.' + {{ personal_page|tojson }}) === '1'; } catch (e) {}
    if (collapsed) {
      document.getElementById('pcBody').style.display = 'none';
      var b = document.getElementById('pcToggle'); b.textContent = '▶'; b.setAttribute('aria-expanded', 'false');
    }
  })();
</script>

<!-- 編輯／刪除視窗 -->
<div id="pcOverlay" class="pc-overlay" role="dialog" aria-modal="true" aria-labelledby="pcEditHead">
  <div class="pc-box">
    <h3 id="pcEditHead">編輯事件</h3>
    <form id="pcEditForm" class="pc-form pc-form-edit" autocomplete="off">
      <label>日期<input type="date" name="date" required></label>
      <label>工程師
        <select name="person">
          {% for s in STAFF %}<option value="{{ s.name }}">{{ s.name }}</option>{% endfor %}
        </select>
      </label>
      <label>店編（或 休／MFP 等）<input name="store" list="pcStoreList" maxlength="20"></label>
      <label>店名<input name="name" maxlength="40"></label>
      <label>內容<input name="content" list="pcContentList" maxlength="60"></label>
      <label>時間<input name="time" placeholder="10:00" maxlength="20"></label>
      <label>特殊（Y）<input name="special" maxlength="1" placeholder="Y"></label>
      <label>LINE 提前通知
        <span class="pc-notify">
          <select name="notify_mode">
            <option value="">不通知</option>
            <option value="0">當日</option>
            <option value="custom">提前天數</option>
          </select>
          <input type="number" name="notify_days" min="1" max="60" placeholder="天" style="display:none;">
        </span>
      </label>
    </form>
    <div class="pc-meta" id="pcMeta"></div>
    <div class="pc-err" id="pcErr"></div>
    <div class="pc-box-btns">
      <button type="button" class="pc-btn pc-danger" id="pcDelete">刪除</button>
      <button type="button" class="pc-btn" id="pcCancel">取消</button>
      <button type="button" class="pc-btn pc-primary" id="pcSave">儲存</button>
    </div>
  </div>
</div>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>

<style>
  .pc-section { margin-top: 24px; }
  .pc-title-text { cursor: pointer; user-select: none; }

  .pc-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .pc-card-title { font-weight: bold; font-size: 17px; margin-bottom: 8px; color: #1e293b; }
  .pc-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 10px; }

  .pc-form input, .pc-form select {
    padding: 7px 8px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 6px;

  .pc-link:hover { background: none; }

<script>
document.addEventListener('DOMContentLoaded', function () {
  const PERSON = {{ personal_page|tojson }};
  const URL_EVENTS = {{ url_for('personal_calendar_events', name=personal_page)|tojson }};
  const URL_SAVE = {{ url_for('personal_calendar_save')|tojson }};
  const URL_DELETE = {{ url_for('personal_calendar_delete')|tojson }};
  const URL_STORES = {{ url_for('personal_calendar_stores')|tojson }};
  const LOGIN_URL = {{ url_for('billing.login')|tojson }};
  const FIELDS = ['date', 'person', 'store', 'name', 'content', 'time', 'special'];

  function readJson(r) { return r.json().catch(function () { return null; }); }
  function call(url, body) {
    return fetch(url, {
      method: body ? 'POST' : 'GET', credentials: 'same-origin', cache: 'no-store',
      headers: Object.assign({ 'X-Requested-With': 'fetch', 'Accept': 'application/json' }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return readJson(r).then(function (j) {
        if (r.status === 401) { location.href = (j && j.login_url) || LOGIN_URL; throw new Error('登入已逾時'); }
        if (!r.ok || !j || j.status !== 'ok') throw new Error((j && j.message) || ('伺服器錯誤（' + r.status + '）'));
        return j;
      });
    }, function () { throw new Error('無法連線到伺服器'); });
  }
  function todayStr() {
    const d = new Date(); const p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  // 提前通知：空白＝不通知、'0'＝當日、'N'＝提前 N 天
  function readNotify(f) {
    const m = f.elements.notify_mode.value;
    if (m !== 'custom') return m;
    const n = (f.elements.notify_days.value || '').trim();
    if (!/^\d+$/.test(n) || +n < 1 || +n > 60) throw new Error('提前天數請填 1～60');
    return String(+n);
  }
  function fillNotify(f, v) {
    v = v == null ? '' : String(v);
    f.elements.notify_mode.value = v === '' ? '' : (v === '0' ? '0' : 'custom');
    f.elements.notify_days.value = (v !== '' && v !== '0') ? v : '';
    syncNotify(f);
  }
  function syncNotify(f) {
    const custom = f.elements.notify_mode.value === 'custom';
    f.elements.notify_days.style.display = custom ? '' : 'none';
    if (custom && !f.elements.notify_days.value) f.elements.notify_days.value = '1';
  }
  function readForm(f) {
    const o = {}; FIELDS.forEach(function (k) { o[k] = (f.elements[k].value || '').trim(); });
    o.special = o.special.toUpperCase(); o.notify = readNotify(f); return o;
  }
  function fillForm(f, o) { FIELDS.forEach(function (k) { f.elements[k].value = o[k] || ''; }); fillNotify(f, o.notify); }
  function notifyText(v) { return v === '' || v == null ? '' : (String(v) === '0' ? '當日通知' : '提前 ' + v + ' 天通知'); }

  // ===== LINE 通知綁定 =====
  const URL_LINE = {{ url_for('personal_line_status', name=personal_page)|tojson }};
  const URL_LINE_CODE = {{ url_for('personal_line_code', name=personal_page)|tojson }};
  const URL_LINE_UNBIND = {{ url_for('personal_line_unbind', name=personal_page)|tojson }};
  const lnText = document.getElementById('pcLineText'), lnCode = document.getElementById('pcLineCode');
  const lnUnbind = document.getElementById('pcLineUnbind'), lnBox = document.getElementById('pcLineCodeBox');
  let lineBound = null, linePoll = null, lineArmed = false;

  function lineSet(html) { lnText.innerHTML = html; }
  function esc(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
  function lineRender(st) {
    lineBound = !!st.bound;
    lnUnbind.textContent = '解除綁定'; lineArmed = false;
    if (!st.configured) {
      lineSet('LINE 通知：<span class="warn">網站尚未設定 LINE 金鑰</span>（設定後才能綁定與發送提醒）');
      lnCode.style.display = 'none'; lnUnbind.style.display = 'none'; return;
    }
    if (lineBound) {
      lineSet('🔔 LINE 通知：<span class="ok">已綁定</span>' + (st.bound_at ? '（' + esc(st.bound_at.slice(0, 16)) + '）' : '') + '，提醒會在每天早上 8 點左右送出');
      lnCode.style.display = 'none'; lnUnbind.style.display = ''; lnBox.style.display = 'none';
      clearInterval(linePoll); linePoll = null;
    } else {
      lineSet('LINE 通知：<span class="warn">尚未綁定</span>，設定的提前通知不會送出');
      lnCode.style.display = ''; lnUnbind.style.display = 'none';
    }
  }
  function lineLoad() { return call(URL_LINE).then(lineRender).catch(function (e) { lineSet('LINE 通知：' + esc(e.message)); }); }
  lnCode.addEventListener('click', function () {
    lnCode.disabled = true;
    call(URL_LINE_CODE, {}).then(function (j) {
      const add = j.add_friend_url ? '<a href="' + esc(j.add_friend_url) + '" target="_blank" rel="noopener">加入官方帳號好友</a>' : '加入部門 LINE 官方帳號好友';
      lnBox.innerHTML = '綁定碼 <b class="code">' + esc(j.code) + '</b>（' + j.minutes + ' 分鐘內有效，至 ' + esc(j.expire.slice(11, 16)) + '）<br>' +
        '① 用 <b>' + esc(PERSON) + '</b> 本人的 LINE ' + add + '<br>② 在聊天室傳送：<b>綁定 ' + esc(j.code) + '</b><br>' +
        '③ 收到「已綁定」回覆後，這裡會自動更新（也可以按 <button type="button" class="pc-btn pc-link" id="pcLineRecheck">重新檢查</button>）';
      lnBox.style.display = '';
      document.getElementById('pcLineRecheck').addEventListener('click', lineLoad);
      clearInterval(linePoll);
      const until = Date.now() + j.minutes * 60000;
      linePoll = setInterval(function () { if (Date.now() > until) { clearInterval(linePoll); linePoll = null; return; } lineLoad(); }, 5000);
    }).catch(function (e) { lineSet('LINE 通知：' + esc(e.message)); })
      .then(function () { lnCode.disabled = false; });
  });
  lnUnbind.addEventListener('click', function () {
    if (!lineArmed) { lineArmed = true; lnUnbind.textContent = '確定解除綁定？'; return; }
    lnUnbind.disabled = true;
    call(URL_LINE_UNBIND, {}).then(lineLoad).catch(function (e) { lineSet('LINE 通知：' + esc(e.message)); })
      .then(function () { lnUnbind.disabled = false; });
  });
  lineLoad();

  // ===== 門市清單：店編 → 店名自動帶入 =====
  const STORES = {};
  call(URL_STORES).then(function (j) {
    const dl = document.getElementById('pcStoreList');
    j.stores.forEach(function (s) {
      STORES[s.id] = s.name;
      const o = document.createElement('option'); o.value = s.id; o.label = s.name; dl.appendChild(o);
    });
  }).catch(function () { /* 讀不到門市清單時，店名改為手動輸入 */ });
  function bindAutoName(f) {
    let lastAuto = '';
    f.elements.store.addEventListener('input', function () {
      const name = STORES[f.elements.store.value.trim()];
      const cur = f.elements.name.value.trim();
      if (name && (!cur || cur === lastAuto)) { f.elements.name.value = name; lastAuto = name; }
      else if (!name && cur && cur === lastAuto) { f.elements.name.value = ''; lastAuto = ''; }
    });
    return function reset() { lastAuto = ''; };
  }

  // ===== 訊息列 =====
  const msgBox = document.getElementById('pcMsg'), msgText = document.getElementById('pcMsgText'), retryBtn = document.getElementById('pcRetry');
  function showError(text) { msgText.textContent = '⚠️ ' + text; msgBox.className = 'pc-msg error'; retryBtn.style.display = ''; msgBox.style.display = 'flex'; }
  function clearError() { msgBox.style.display = 'none'; }

  // ===== 週末顯示（與部門排程表相同：預設隱藏，當月有排程才展開，可手動切換）=====
  const wkBtn = document.getElementById('pcWeekendBtn'), wkAuto = document.getElementById('pcWeekendAuto');
  let wkMode = 'auto', hiddenNow = [0, 6], forceFresh = false;
  function updateWeekends() {
    const v = calendar.view; let sat = 0, sun = 0;
    calendar.getEvents().forEach(function (ev) {
      const d = ev.start; if (!d || d < v.currentStart || d >= v.currentEnd) return;
      if (d.getDay() === 6) sat++; if (d.getDay() === 0) sun++;
    });
    let hidden;
    if (wkMode === 'show') hidden = []; else if (wkMode === 'hide') hidden = [0, 6];
    else { hidden = []; if (!sun) hidden.push(0); if (!sat) hidden.push(6); }
    if (hidden.join(',') !== hiddenNow.join(',')) { hiddenNow = hidden; calendar.setOption('hiddenDays', hidden); }
    const shown = hidden.length < 2, total = sat + sun;
    wkBtn.textContent = shown ? '隱藏週六日' : ('顯示週六日' + (total ? '（' + total + ' 筆）' : ''));
    wkBtn.classList.toggle('active', wkMode === 'show');
    wkAuto.style.display = wkMode === 'auto' ? 'none' : '';
  }

  const IS_MOBILE = window.matchMedia && window.matchMedia('(max-width: 768px)').matches;
  const calendar = new FullCalendar.Calendar(document.getElementById('pcCalendar'), {
    initialView: 'dayGridMonth',
    hiddenDays: [0, 6],
    headerToolbar: IS_MOBILE ? { left: 'prev,next', center: 'title', right: 'today' } : { left: 'title', center: '', right: 'today prev,next' },
    height: 'auto',
    eventDisplay: 'block',
    dayMaxEventRows: false,
    dayCellContent: function (arg) { return arg.dayNumberText; },
    events: function (info, success, failure) {
      const url = URL_EVENTS + (forceFresh ? '?fresh=1' : ''); forceFresh = false;
      call(url).then(function (j) { clearError(); success(j.events); })
        .catch(function (e) { showError(e.message || '個人行事曆載入失敗'); failure(e); });
    },
    eventContent: function (arg) {
      const t = document.createElement('div'); t.className = 'pc-ev-title';
      t.textContent = (arg.event.extendedProps.notify !== '' && arg.event.extendedProps.notify != null ? '🔔 ' : '') + arg.event.title;
      return { domNodes: [t] };
    },
    eventDidMount: function (info) {
      const nt = notifyText(info.event.extendedProps.notify);
      info.el.title = '點擊可編輯或刪除' + (nt ? '（LINE ' + nt + '）' : '');
      if (info.event.extendedProps.special === 'Y') info.el.classList.add('ev-special');
    },
    eventsSet: updateWeekends,
    datesSet: updateWeekends,
    dateClick: function (info) {            // 點空白日期：帶入新增表單的日期
      addForm.elements.date.value = info.dateStr;
      addForm.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    },
    eventClick: function (info) { info.jsEvent.preventDefault(); openEdit(info.event); }
  });
  calendar.render();

  // ===== 標題：顯示／隱藏整個行事曆區塊（狀態記在瀏覽器，每位人員的頁面各自記憶）=====
  const PC_KEY = 'pmq3.personalCalendar.collapsed.' + PERSON;
  const pcBody = document.getElementById('pcBody'), pcToggle = document.getElementById('pcToggle');
  function setCollapsed(c) {
    pcBody.style.display = c ? 'none' : '';
    pcToggle.textContent = c ? '▶' : '▼';
    pcToggle.setAttribute('aria-expanded', c ? 'false' : 'true');
    try { localStorage.setItem(PC_KEY, c ? '1' : '0'); } catch (e) {}
    if (!c) calendar.updateSize();          // 收合時無法計算尺寸，展開後重新排版
  }
  function toggleCalendar() { setCollapsed(pcBody.style.display !== 'none'); }
  pcToggle.addEventListener('click', toggleCalendar);
  document.getElementById('pcTitleText').addEventListener('click', toggleCalendar);

  function reload() { forceFresh = true; calendar.refetchEvents(); }
  retryBtn.addEventListener('click', reload);
  wkBtn.addEventListener('click', function () { wkMode = hiddenNow.length < 2 ? 'hide' : 'show'; updateWeekends(); });
  wkAuto.addEventListener('click', function () { wkMode = 'auto'; updateWeekends(); });

  // ===== 新增 =====
  const addForm = document.getElementById('pcAddForm'), addBtn = document.getElementById('pcAddBtn'), addMsg = document.getElementById('pcAddMsg');
  addForm.elements.date.value = todayStr();
  [addForm, document.getElementById('pcEditForm')].forEach(function (f) {
    f.elements.notify_mode.addEventListener('change', function () { syncNotify(f); });
  });
  const resetAddAuto = bindAutoName(addForm);
  function setAddMsg(text, kind) { addMsg.textContent = text; addMsg.className = 'pc-hint' + (kind ? ' ' + kind : ''); }
  function doAdd() {
    let data;
    try { data = readForm(addForm); } catch (e) { setAddMsg('❌ ' + e.message, 'err'); return; }
    addBtn.disabled = true; setAddMsg('新增中…');
    call(URL_SAVE, data).then(function () {
      let msg = data.person === PERSON ? '✅ 已新增 ' + data.date + ' 的事件' : '✅ 已新增到「' + data.person + '」的個人行事曆';
      if (data.notify !== '' && data.person === PERSON && lineBound === false) msg += '（尚未綁定 LINE，提醒不會送出）';
      setAddMsg(msg, 'ok');
      ['store', 'name', 'content', 'time', 'special'].forEach(function (k) { addForm.elements[k].value = ''; });
      fillNotify(addForm, '');
      resetAddAuto();
      if (data.person === PERSON) { calendar.gotoDate(data.date); reload(); }
    }).catch(function (e) { setAddMsg('❌ ' + e.message, 'err'); })
      .then(function () { addBtn.disabled = false; });
  }
  addBtn.addEventListener('click', doAdd);
  addForm.addEventListener('submit', function (e) { e.preventDefault(); doAdd(); });
  addForm.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing && e.target.tagName === 'INPUT') { e.preventDefault(); doAdd(); } });

  // ===== 編輯／刪除 =====
  const ov = document.getElementById('pcOverlay'), editForm = document.getElementById('pcEditForm');
  const btnSave = document.getElementById('pcSave'), btnDel = document.getElementById('pcDelete'), btnCancel = document.getElementById('pcCancel');
  const errBox = document.getElementById('pcErr'), meta = document.getElementById('pcMeta');
  const resetEditAuto = bindAutoName(editForm);
  let editingId = null, delArmed = false;

  function setBusy(b) { [btnSave, btnDel, btnCancel].forEach(function (x) { x.disabled = b; }); }
  function disarm() { delArmed = false; btnDel.textContent = '刪除'; btnDel.classList.remove('armed'); }
  function openEdit(ev) {
    const p = ev.extendedProps;
    editingId = ev.id;
    fillForm(editForm, { date: ev.startStr.slice(0, 10), person: p.person, store: p.store, name: p.name, content: p.content, time: p.time, special: p.special, notify: p.notify });
    resetEditAuto();
    meta.textContent = '建立：' + (p.created_by || '—') + '　' + (p.created_at || '') +
      (p.updated_at && p.updated_at !== p.created_at ? '\n最後修改：' + (p.updated_by || '—') + '　' + p.updated_at : '') +
      (p.notified ? '\nLINE 提醒：已送出（若修改日期或提前天數，會再通知一次）' : '');
    meta.style.whiteSpace = 'pre-line';
    errBox.textContent = ''; disarm(); setBusy(false);
    ov.classList.add('show');
  }
  function closeEdit() { ov.classList.remove('show'); editingId = null; disarm(); }

  btnSave.addEventListener('click', function () {
    if (!editingId) return;
    let data;
    try { data = readForm(editForm); } catch (e) { errBox.textContent = e.message; return; }
    data.id = editingId;
    setBusy(true); errBox.textContent = '';
    call(URL_SAVE, data).then(function () {
      closeEdit();
      if (data.person !== PERSON) setAddMsg('✅ 事件已移到「' + data.person + '」的個人行事曆', 'ok');
      reload();
    }).catch(function (e) { errBox.textContent = e.message; setBusy(false); });
  });
  // 刪除：按兩次確認（第一次變紅色「確定刪除？」）
  btnDel.addEventListener('click', function () {
    if (!editingId) return;
    if (!delArmed) { delArmed = true; btnDel.textContent = '確定刪除？'; btnDel.classList.add('armed'); return; }
    setBusy(true); errBox.textContent = '';
    call(URL_DELETE, { id: editingId }).then(function () { closeEdit(); reload(); })
      .catch(function (e) { errBox.textContent = e.message; setBusy(false); disarm(); });
  });
  btnCancel.addEventListener('click', closeEdit);
  ov.addEventListener('click', function (e) { if (e.target === ov) closeEdit(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && ov.classList.contains('show')) closeEdit(); });
});
</script>
