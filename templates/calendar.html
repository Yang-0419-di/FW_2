{% extends "layout.html" %}

{% block content %}
<!-- === 部門排程頁 calendar.html === -->

    <h2>部門排程</h2>

	<!-- 顏色說明列（由 modules/staff.py 自動產生） -->
	<div class="legend">
	  {% for s in STAFF %}
	  <span class="legend-item">
		<span class="color-box" style="background-color: {{ s.color }};"></span> {{ s.name }}
	  </span>
	  {% endfor %}
	  <span class="legend-item">
		<span class="color-box" style="background-color: {{ STAFF_DEFAULT_COLOR }};"></span> 未指定
	  </span>
	  <span class="legend-item">
		<span class="color-box" style="background-color: {{ STAFF_PAST_COLOR }};"></span> 已過期
	  </span>
	  <span class="legend-item">
		<span class="color-box special"></span> 特殊
	  </span>
	</div>
	<div class="legend-hint">點擊工務可填寫「人員2」；當月週六、週日有排程時，該欄才會顯示。</div>

  <!-- 載入失敗／警告訊息 -->
  <div id="calMsg" class="cal-msg" style="display:none;">
    <span id="calMsgText"></span>
    <button type="button" id="calRetry" style="display:none;">重新載入</button>
  </div>

  <!-- FullCalendar CSS & JS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>

  <style>
    /* 允許事件標題/時間換行，移除省略號 */
    .fc .fc-event-title,
    .fc .fc-event-time,
    .fc .fc-event-main {
      white-space: normal !important;
      overflow: visible !important;
      text-overflow: clip !important;
    }

    /* 月曆 (dayGrid) 兩種事件外觀都一併處理 */
    .fc .fc-daygrid-event,
    .fc .fc-daygrid-dot-event {
      white-space: normal !important;
      cursor: pointer;
    }

    /* 長字串也能自動換行 */
    .fc .fc-daygrid-event .fc-event-title,
    .fc .fc-daygrid-dot-event .fc-event-title,
    .fc .fc-timegrid-event .fc-event-title,
    .ev-title, .ev-people {
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .ev-people {
      margin-top: 2px;
      padding-top: 2px;
      border-top: 1px dashed rgba(255,255,255,0.7);
      font-weight: bold;
    }

    /* 讓事件方塊更緊湊好閱讀 */
    .fc .fc-daygrid-event {
      display: block;
      padding: 2px 4px;
    }

    /* 固定每日格子高度 */
    .fc .fc-daygrid-day-frame {
      min-height: 160px !important;
      overflow-y: auto !important;
    }

    /* 避免 flex 撐高 */
    .fc .fc-daygrid-day {
      flex: 0 0 auto !important;
    }

    /* 週末欄位淡色底，展開時容易分辨 */
    .fc .fc-day-sat, .fc .fc-day-sun {
      background-color: #fff8e6;
    }

    #calendar {
      background-color: white;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 8px;
    }

    #backToTop {
      position: fixed;
      bottom: 230px;
      right: 30px;
      z-index: 1000;
      display: none;
      padding: 10px 15px;
      font-size: 16px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    #backToTop:hover {
      background-color: #0056b3;
    }
	  .legend {
		margin: 8px 0 4px 0;
		display: flex;
		flex-wrap: wrap;
		gap: 20px;
		align-items: center;
		font-size: 16px;
	  }

	  .legend-item {
		display: flex;
		align-items: center;
		gap: 6px;
	  }

	  .color-box {
		display: inline-block;
		width: 60px;           /* 約等於名字寬度，可依需要調整 */
		height: 20px;
		border-radius: 4px;
	  }
	  .color-box.special {
		background-color: #fff;
		border: 2px solid red;
		box-sizing: border-box;
	  }
	  .legend-hint {
		margin: 0 0 12px 0;
		font-size: 13px;
		color: #666;
	  }

    /* 訊息列 */
    .cal-msg {
      margin: 0 0 12px 0;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 15px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .cal-msg.error { background: #fdecea; color: #b71c1c; border: 1px solid #f5c2c0; }
    .cal-msg.warn  { background: #fff4e5; color: #8a5300; border: 1px solid #ffd8a8; }
    .cal-msg button { padding: 4px 12px; cursor: pointer; }

    /* 人員2 編輯視窗 */
    .p2-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: none; align-items: center; justify-content: center; z-index: 2000;
    }
    .p2-overlay.show { display: flex; }
    .p2-box {
      background: #fff; border-radius: 10px; padding: 20px 22px; width: min(420px, 92vw);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25); font-size: 15px;
    }
    .p2-box h3 { margin: 0 0 12px 0; }
    .p2-row { margin: 8px 0; }
    .p2-row .lbl { color: #666; font-size: 13px; display: block; margin-bottom: 2px; }
    .p2-row .val { white-space: pre-wrap; overflow-wrap: anywhere; }
    .p2-row input { width: 100%; box-sizing: border-box; padding: 7px 8px; font-size: 15px; border: 1px solid #bbb; border-radius: 5px; }
    .p2-err { color: #b71c1c; min-height: 1.2em; margin-top: 6px; font-size: 14px; }
    .p2-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
    .p2-btns button { padding: 6px 14px; font-size: 15px; border-radius: 5px; border: 1px solid #999; background: #f5f5f5; cursor: pointer; }
    .p2-btns .primary { background: #007BFF; color: #fff; border-color: #007BFF; }
    .p2-btns .danger { color: #b71c1c; border-color: #e0a0a0; background: #fff; margin-right: auto; }
    .p2-btns button:disabled { opacity: .6; cursor: default; }
  </style>

  <div id="calendar"></div>

  <!-- 人員2 編輯視窗 -->
  <div id="p2Overlay" class="p2-overlay" role="dialog" aria-modal="true" aria-labelledby="p2Head">
    <div class="p2-box">
      <h3 id="p2Head">填寫人員2</h3>
      <div class="p2-row"><span class="lbl">日期</span><span class="val" id="p2Date"></span></div>
      <div class="p2-row"><span class="lbl">工務</span><span class="val" id="p2Title"></span></div>
      <div class="p2-row"><span class="lbl">預設人員（來自排程檔）</span><span class="val" id="p2Owner"></span></div>
      <div class="p2-row">
        <label class="lbl" for="p2Input">人員2（可直接輸入姓名，多人可用「、」分隔）</label>
        <input id="p2Input" type="text" maxlength="30" list="p2List" autocomplete="off">
        <datalist id="p2List">
          {% for s in STAFF %}<option value="{{ s.name }}">{% endfor %}
        </datalist>
      </div>
      <div class="p2-err" id="p2Err"></div>
      <div class="p2-btns">
        <button type="button" class="danger" id="p2Clear">清除人員2</button>
        <button type="button" id="p2Cancel">取消</button>
        <button type="button" class="primary" id="p2Save">儲存</button>
      </div>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const EVENTS_URL = "{{ url_for('calendar_events') }}";
  const ASSIGN_URL = "{{ url_for('calendar_assign') }}";
  const LOGIN_URL  = "{{ url_for('billing.login') }}";

  const msgBox = document.getElementById('calMsg');
  const msgText = document.getElementById('calMsgText');
  const retryBtn = document.getElementById('calRetry');

  function showMsg(lines, kind, retry) {
    if (!lines || !lines.length) { msgBox.style.display = 'none'; return; }
    msgText.textContent = lines.join('　');
    msgBox.className = 'cal-msg ' + kind;
    retryBtn.style.display = retry ? '' : 'none';
    msgBox.style.display = 'flex';
  }

  function readJson(r) { return r.json().catch(function () { return null; }); }

  let forceFresh = false;   // 儲存人員2 後，略過伺服器快取重新讀取

  // ===== 週末自動展開：當月有週六／週日排程才顯示該欄 =====
  function updateWeekends() {
    const v = calendar.view;
    let sat = false, sun = false;
    calendar.getEvents().forEach(function (ev) {
      const d = ev.start;
      if (!d || d < v.currentStart || d >= v.currentEnd) return;
      const w = d.getDay();
      if (w === 6) sat = true;
      if (w === 0) sun = true;
    });
    const hidden = [];
    if (!sun) hidden.push(0);
    if (!sat) hidden.push(6);
    const cur = (calendar.getOption('hiddenDays') || []).join(',');
    if (cur !== hidden.join(',')) calendar.setOption('hiddenDays', hidden);
  }

  const calendarEl = document.getElementById('calendar');
  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    hiddenDays: [0, 6],              // 預設隱藏週末，有排程時由 updateWeekends 展開
    events: function (info, success, failure) {
      const url = EVENTS_URL + (forceFresh ? '?fresh=1' : '');
      forceFresh = false;
      fetch(url, { credentials: 'same-origin', headers: { 'X-Requested-With': 'fetch', 'Accept': 'application/json' } })
        .then(function (r) {
          return readJson(r).then(function (data) {
            if (r.status === 401) { location.href = (data && data.login_url) || LOGIN_URL; return; }
            if (!r.ok || !data || data.status !== 'ok') {
              throw new Error((data && data.message) || ('排程載入失敗（伺服器回應 ' + r.status + '）'));
            }
            showMsg(data.warnings, 'warn', false);
            success(data.events);
          });
        })
        .catch(function (err) {
          showMsg(['⚠️ ' + (err && err.message && err.message !== 'Failed to fetch' ? err.message : '無法連線到伺服器，排程載入失敗。')], 'error', true);
          failure(err);
        });
    },
    eventDisplay: 'block',
    dayCellContent: function (arg) { return arg.dayNumberText; },
    height: 'auto',
    contentHeight: 'auto',
    dayMaxEventRows: false,
    aspectRatio: 1.35,

    // 標題一行、人員一行（用 textContent，避免資料內容被當成 HTML）
    eventContent: function (arg) {
      const p = arg.event.extendedProps;
      const t = document.createElement('div');
      t.className = 'ev-title';
      t.textContent = p.base_title || arg.event.title;
      const nodes = [t];
      if (p.person2) {
        const ppl = document.createElement('div');
        ppl.className = 'ev-people';
        ppl.textContent = '人員：' + [p.owner, p.person2].filter(Boolean).join(' & ');
        nodes.push(ppl);
      }
      return { domNodes: nodes };
    },

    eventDidMount: function (info) {
      info.el.title = '點擊可填寫人員2';
      if (info.event.extendedProps.is_special) {
        // ⭐ 只改邊框，不改底色
        info.el.style.border = '2px solid red';
        info.el.style.fontWeight = 'bold';
      }
    },

    eventsSet: updateWeekends,
    datesSet: updateWeekends,
    eventClick: function (info) { info.jsEvent.preventDefault(); openEditor(info.event); }
  });

  calendar.render();
  retryBtn.addEventListener('click', function () { calendar.refetchEvents(); });

  // ===== 人員2 編輯視窗 =====
  const ov = document.getElementById('p2Overlay');
  const inp = document.getElementById('p2Input');
  const err = document.getElementById('p2Err');
  const btnSave = document.getElementById('p2Save');
  const btnClear = document.getElementById('p2Clear');
  const btnCancel = document.getElementById('p2Cancel');
  let editing = null;

  function openEditor(ev) {
    const p = ev.extendedProps;
    editing = { date: ev.startStr.slice(0, 10), title: p.base_title };
    document.getElementById('p2Date').textContent = editing.date;
    document.getElementById('p2Title').textContent = p.base_title;
    document.getElementById('p2Owner').textContent = p.owner || '（未指定）';
    inp.value = p.person2 || '';
    btnClear.style.display = p.person2 ? '' : 'none';
    err.textContent = '';
    setBusy(false);
    ov.classList.add('show');
    setTimeout(function () { inp.focus(); inp.select(); }, 0);
  }
  function closeEditor() { ov.classList.remove('show'); editing = null; }
  function setBusy(b) { [btnSave, btnClear, btnCancel, inp].forEach(function (x) { x.disabled = b; }); btnSave.textContent = b ? '儲存中…' : '儲存'; }

  function submit(person2) {
    if (!editing) return;
    setBusy(true); err.textContent = '';
    fetch(ASSIGN_URL, {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'fetch', 'Accept': 'application/json' },
      body: JSON.stringify({ date: editing.date, title: editing.title, person2: person2 })
    })
      .then(function (r) {
        return readJson(r).then(function (data) {
          if (r.status === 401) { location.href = (data && data.login_url) || LOGIN_URL; return; }
          if (!r.ok || !data || data.status !== 'ok') throw new Error((data && data.message) || ('儲存失敗（' + r.status + '）'));
          closeEditor();
          forceFresh = true;
          calendar.refetchEvents();          // 重新讀取排程，畫面立即顯示新的人員
        });
      })
      .catch(function (e) { err.textContent = (e && e.message) || '儲存失敗'; setBusy(false); });
  }

  btnSave.addEventListener('click', function () { submit(inp.value.trim()); });
  btnClear.addEventListener('click', function () { submit(''); });
  btnCancel.addEventListener('click', closeEditor);
  ov.addEventListener('click', function (e) { if (e.target === ov) closeEditor(); });
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(inp.value.trim()); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && ov.classList.contains('show')) closeEditor(); });
});
</script>

{% endblock %}
